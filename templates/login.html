<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
    <h1>Login</h1>
    <form id="loginForm">
        <label>Usuario:</label>
        <input type="text" name="username" required />
        <br />
        <label>Contraseña:</label>
        <input type="password" name="password" required minlength="8" />
        <br />
        <button type="submit">Ingresar</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault(); // Evita recarga

            const form = e.target;
            const username = form.username.value;
            const password = form.password.value;

            // Validar mínimo 8 caracteres
            if (password.length < 8) {
                document.getElementById('result').textContent = 'La contraseña debe tener al menos 8 caracteres.';
                return;
            }

            // Hashear la contraseña
            const hashedPassword = CryptoJS.SHA256(password).toString(CryptoJS.enc.Hex);
            console.log('Contraseña hasheada:', hashedPassword);
            // Crear datos
            const data = new URLSearchParams();
            data.append('username', username);
            data.append('password', hashedPassword);

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: data
                });

                const result = await response.json();
                document.getElementById('result').textContent = result.message;
            } catch (error) {
                console.error('Error al hacer login', error);
                document.getElementById('result').textContent = 'Error al conectar con el servidor.';
            }
        });
    </script>
</body>
</html>
